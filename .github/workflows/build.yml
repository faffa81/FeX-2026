name: Build

on:
  push:
    branches-ignore:
      - gh-readonly-queue/**
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows client
    runs-on: windows-latest
    env:
      CARGO_HTTP_MULTIPLEXING: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Same configuration that is used for local FeX builds: Ninja, MSVC, client
    # only. The runner image already ships a Rust toolchain for the rust-bridge
    # crate. Build output goes to files so a failure prints just the error tail
    # instead of the whole compile log.
    - name: Configure and build
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
        if not defined VSPATH (
          echo Could not locate a Visual Studio installation.
          exit /b 1
        )
        call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" >nul
        if errorlevel 1 exit /b 1

        cmake -S . -B build -G Ninja ^
          -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
          -DCLIENT=ON -DSERVER=OFF -DTOOLS=OFF -DDOWNLOAD_GTEST=OFF > configure.log 2>&1
        if errorlevel 1 (
          echo Configure failed:
          type configure.log
          exit /b 1
        )

        cmake --build build --parallel > build.log 2>&1
        if errorlevel 1 (
          echo Build failed, last lines of the log:
          powershell -NoProfile -Command "Get-Content build.log -Tail 60"
          exit /b 1
        )

    - name: Upload client
      uses: actions/upload-artifact@v4
      with:
        name: FeX-windows
        path: build/FeX.exe
        if-no-files-found: error
