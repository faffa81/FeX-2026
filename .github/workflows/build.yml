name: Build

on:
  push:
    branches-ignore:
      - gh-readonly-queue/**
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows client
    runs-on: windows-latest
    env:
      CARGO_HTTP_MULTIPLEXING: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    # Same configuration that is used for local FeX builds: Ninja, MSVC, client
    # only. Kept warning-tolerant on purpose, the FeX sources are not held to
    # DDNet's -Werror baseline.
    - name: Configure
      run: >
        cmake -S . -B build -G Ninja
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DCLIENT=ON -DSERVER=OFF -DTOOLS=OFF -DDOWNLOAD_GTEST=OFF

    # Output goes to a file so a failure only prints the tail, which keeps the
    # job log readable and shows the actual compiler error.
    - name: Build client
      shell: pwsh
      run: |
        cmake --build build --parallel *> build.log
        $status = $LASTEXITCODE
        if ($status -ne 0) {
          Write-Host "Build failed, last lines of the log:"
          Get-Content build.log -Tail 60
        }
        exit $status

    - name: Upload client
      uses: actions/upload-artifact@v4
      with:
        name: FeX-windows
        path: build/FeX.exe
        if-no-files-found: error
